<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Registro dinámico de rutinas, series, volumen y progresión para hipertrofia.">
  <title>Hypertrofia Tracker v3.1</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="v3.css">
  <link rel="stylesheet" href="v31.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">COACH DE HIPERTROFIA</p>
        <h1>Hypertrofia Tracker <span class="version-pill">v3.1</span></h1>
      </div>
      <div class="topbar-actions">
        <span id="syncIndicator" class="sync-indicator" title="Estado de sincronización">Local</span>
        <button id="installBtn" class="icon-button hidden" type="button" aria-label="Instalar aplicación">⬇️</button>
      </div>
    </header>

    <main id="mainContent" class="main-content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button type="button" data-route="dashboard"><span>⌂</span><small>Inicio</small></button>
      <button type="button" data-route="workout"><span>＋</span><small>Entreno</small></button>
      <button type="button" data-route="routines"><span>▦</span><small>Rutinas</small></button>
      <button type="button" data-route="analytics"><span>↗</span><small>Análisis</small></button>
      <button type="button" data-route="profile"><span>⚙</span><small>Perfil</small></button>
    </nav>

    <div id="restDock" class="rest-dock hidden" role="timer">
      <div>
        <small>DESCANSO</small>
        <strong id="restDockTime">03:00</strong>
      </div>
      <div class="rest-dock-actions">
        <button id="restDockPause" class="small-button" type="button">Pausar</button>
        <button id="restDockSkip" class="small-button ghost" type="button">Saltar</button>
      </div>
    </div>

    <div id="modalRoot"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="v3-exercises-upper.js" defer></script>
  <script src="v3-exercises-lower.js" defer></script>
  <script src="v3-exercises-core.js" defer></script>
  <script src="v3-base.js" defer></script>
  <script src="v3-state.js" defer></script>
  <script src="v3-dashboard.js" defer></script>
  <script src="v3-workout-builder.js" defer></script>
  <script src="v3-workout-active.js" defer></script>
  <script src="v3-routines.js" defer></script>
  <script src="v3-analytics.js" defer></script>
  <script src="v3-profile.js" defer></script>
  <script src="v3-recovery.js" defer></script>
  <script src="v3-cloud-timers.js" defer></script>
  <script src="v3-events.js" defer></script>
  <script src="v31-dynamic.js" defer></script>
  <script src="v31-fixes.js" defer></script>
</body>
</html>
